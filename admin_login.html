<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:#1e293b;
            padding:30px;
            border-radius:15px;
            width:350px;
        }

        h2{
            text-align:center;
            color:#38bdf8;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#38bdf8;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .error{
            color:#ef4444;
            text-align:center;
            margin-bottom:10px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>Admin Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
